<!DOCTYPE html>
<html lang="ru" class="mobile-client">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Вход — Waifu Mobile</title>
  <link rel="stylesheet" href="/webapp/mobile-theme.css" />
  <link rel="stylesheet" href="/webapp/mobile/mobile-shell.css" />
  <script defer src="/webapp/pages/desktop-telegram-login.js"></script>
</head>
<body class="page-mobile-login">
  <main class="mobile-login-card">
    <h1>Waifu Activity</h1>
    <p class="muted">Войдите через Telegram — аккаунт привяжется автоматически.</p>

    <button type="button" id="btn-telegram" class="mobile-btn primary">Войти через Telegram</button>

    <details class="mobile-login-fallback" id="code-fallback">
      <summary>Запасной вход: код из профиля Telegram</summary>
      <p class="muted small">
        В Telegram WebApp: профиль → ☰ → «Код для Mobile / Steam» (или Настройки игрока).
        Скопируйте код и вставьте ниже.
      </p>
      <label class="mobile-field">
        Код привязки
        <input id="link-code" type="text" inputmode="text" autocomplete="one-time-code" placeholder="например AB12CD" maxlength="32" />
      </label>
      <div id="google-sub-wrap" class="mobile-dev-only" hidden>
        <label class="mobile-field">
          Google sub (только stage/dev)
          <input id="google-sub" type="text" placeholder="dev-google-sub" value="mobile-dev-user" />
        </label>
      </div>
      <button type="button" id="btn-login-link" class="mobile-btn secondary">Войти с кодом</button>
      <button type="button" id="btn-login-solo" class="mobile-btn secondary mobile-dev-only" hidden>Продолжить без привязки</button>
    </details>

    <p id="login-status" class="mobile-status" role="status" aria-live="polite"></p>
    <p id="app-build" class="muted small" style="margin-top:12px"></p>
  </main>
  <script>
    (function () {
      const statusEl = document.getElementById("login-status");
      const codeEl = document.getElementById("link-code");
      const subEl = document.getElementById("google-sub");
      const btnTg = document.getElementById("btn-telegram");
      const host = (window.location.hostname || "").toLowerCase();
      const params = new URLSearchParams(window.location.search || "");
      const showDevAuth =
        params.has("showDevAuth") ||
        host.includes("stage") ||
        host === "localhost" ||
        host === "127.0.0.1";

      if (showDevAuth) {
        document.querySelectorAll(".mobile-dev-only").forEach((el) => {
          el.hidden = false;
        });
      }

      function setBusy(on) {
        [btnTg, document.getElementById("btn-login-link"), document.getElementById("btn-login-solo")].forEach(
          (b) => {
            if (b) b.disabled = !!on;
          }
        );
      }

      function setStatus(msg, ok) {
        statusEl.textContent = msg || "";
        statusEl.classList.toggle("ok", !!ok);
        statusEl.classList.toggle("err", !!msg && !ok);
      }

      function storeSession(token) {
        try {
          localStorage.setItem("waifuDesktopSession", String(token));
        } catch (_) {}
        if (window.waifuMobile?.setDesktopSessionToken) {
          window.waifuMobile.setDesktopSessionToken(String(token));
        }
      }

      function goShell() {
        window.location.replace("/webapp/mobile/shell.html?mobileClient=1");
      }

      async function apiPost(path, body) {
        const res = await fetch(`/api${path}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const text = await res.text();
        let data = null;
        try {
          data = text ? JSON.parse(text) : null;
        } catch (_) {
          data = { detail: text };
        }
        if (!res.ok) {
          const d = data?.detail;
          throw new Error(typeof d === "string" ? d : `HTTP ${res.status}`);
        }
        return data;
      }

      async function finishTelegramSession(data) {
        const token = data?.access_token;
        if (!token) throw new Error("no_access_token");
        storeSession(token);
        setStatus(`Готово: Telegram player #${data.player_id}`, true);
        setTimeout(goShell, 300);
      }

      async function loginWithCode(withLink) {
        if (!showDevAuth) {
          setStatus("Код + google_sub_dev доступны только на stage/dev", false);
          return;
        }
        setBusy(true);
        setStatus("Вход…", true);
        const google_sub_dev = (subEl.value || "").trim();
        if (!google_sub_dev) {
          setStatus("Укажите google sub (stage)", false);
          setBusy(false);
          return;
        }
        const body = { google_sub_dev };
        if (withLink) {
          const code = (codeEl.value || "").trim();
          if (!code) {
            setStatus("Нужен код привязки из Telegram", false);
            setBusy(false);
            return;
          }
          body.link_code = code;
        }
        try {
          const data = await apiPost("/auth/mobile/google", body);
          if (!data?.desktop_session) throw new Error("no_desktop_session");
          storeSession(data.desktop_session);
          setStatus(
            data.linked
              ? `Готово: привязан player #${data.player_id}`
              : `Готово: отдельный аккаунт #${data.player_id}`,
            true
          );
          setTimeout(goShell, 400);
        } catch (e) {
          setStatus(String(e.message || e), false);
        } finally {
          setBusy(false);
        }
      }

      async function fetchLoginCfg() {
        const cfgRes = await fetch("/api/auth/desktop/login-url?client=mobile");
        let cfg = null;
        try {
          cfg = await cfgRes.json();
        } catch (_) {
          cfg = null;
        }
        if (!cfgRes.ok) {
          const detail = typeof cfg?.detail === "string" ? cfg.detail : "login_url_failed";
          throw new Error(detail);
        }
        const clientId = String(cfg.client_id || "").trim();
        if (!clientId || clientId === "NaN") {
          throw new Error("telegram_bot_not_configured");
        }
        const redirectUri =
          (window.DesktopTelegramOidc?.resolvePageRedirectUri?.() || "").trim() ||
          (cfg.suggested_redirect_uri || "").trim();
        if (!redirectUri) throw new Error("missing redirect_uri");
        return { clientId, redirectUri, origin: (cfg.origin || window.location.origin).replace(/\/$/, "") };
      }

      async function loginTelegram() {
        setBusy(true);
        setStatus("Открываем Telegram…", true);
        try {
          if (!window.DesktopTelegramOidc) {
            throw new Error("telegram_oidc_unavailable");
          }
          const { clientId, redirectUri, origin } = await fetchLoginCfg();
          const native = window.DesktopTelegramOidc.isNativePlatform?.();
          if (native) {
            // In-WebView code+PKCE — returns to this page with ?code=
            await window.DesktopTelegramOidc.startCodeRedirect({ clientId, redirectUri });
            return;
          }
          const result = await window.DesktopTelegramOidc.openPopup({
            clientId,
            redirectUri,
            origin,
          });
          const data = await apiPost("/auth/desktop/telegram", { id_token: result.id_token });
          await finishTelegramSession(data);
        } catch (e) {
          const msg = String(e?.message || e);
          if (msg === "popup_blocked") {
            setStatus("Popup заблокирован — разрешите окна или используйте код из профиля", false);
          } else if (msg === "popup_closed") {
            setStatus("Окно Telegram закрыто", false);
          } else if (msg === "telegram_bot_not_configured") {
            setStatus("Telegram Login не настроен на сервере — используйте код из профиля", false);
          } else if (msg === "telegram_oidc_client_secret_not_configured") {
            setStatus(
              "На сервере нет TELEGRAM_OIDC_CLIENT_SECRET (BotFather → Web Login). Нужен для входа из APK.",
              false
            );
          } else if (/bot id required/i.test(msg)) {
            setStatus(
              "Telegram: Bot ID required — добавьте Trusted Origin в BotFather " +
                "(https://stage.shimmirpgbot.ru), не только Redirect URI.",
              false
            );
          } else {
            setStatus(msg, false);
          }
          setBusy(false);
        }
      }

      async function handlePkceReturn() {
        const oidc = window.DesktopTelegramOidc;
        if (!oidc?.consumePkceReturn) return false;
        const ret = oidc.consumePkceReturn(params);
        if (!ret) return false;
        oidc.clearOauthQueryFromUrl?.();
        if (ret.error) {
          setStatus(String(ret.error), false);
          return true;
        }
        setBusy(true);
        setStatus("Завершаем вход…", true);
        try {
          const data = await apiPost("/auth/desktop/telegram/code", {
            code: ret.code,
            redirect_uri: ret.redirect_uri,
            code_verifier: ret.code_verifier,
          });
          await finishTelegramSession(data);
        } catch (e) {
          const msg = String(e?.message || e);
          if (msg === "telegram_oidc_client_secret_not_configured") {
            setStatus(
              "На сервере нет TELEGRAM_OIDC_CLIENT_SECRET (BotFather → Web Login Client Secret).",
              false
            );
          } else {
            setStatus(msg, false);
          }
          setBusy(false);
        }
        return true;
      }

      function showAppBuild() {
        const el = document.getElementById("app-build");
        if (!el) return;
        const v =
          window.waifuMobile?.getAppVersion?.() ||
          window.__WAIFU_APP_VERSION__ ||
          "";
        el.textContent = v ? `APK build ${v}` : "";
      }

      function boot() {
        btnTg.addEventListener("click", () => loginTelegram());
        document.getElementById("btn-login-link").addEventListener("click", () => loginWithCode(true));
        document.getElementById("btn-login-solo").addEventListener("click", () => loginWithCode(false));
        showAppBuild();
        setTimeout(showAppBuild, 500);
        setTimeout(showAppBuild, 1500);

        // OAuth return must run before "already logged in → shell" skip
        const run = async () => {
          // Wait for deferred desktop-telegram-login.js
          let tries = 0;
          while (!window.DesktopTelegramOidc && tries < 40) {
            await new Promise((r) => setTimeout(r, 25));
            tries += 1;
          }
          const handled = await handlePkceReturn();
          if (handled) return;
          try {
            const t = localStorage.getItem("waifuDesktopSession");
            if (t) {
              window.location.replace("/webapp/mobile/shell.html?mobileClient=1");
            }
          } catch (_) {}
        };
        void run();
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot);
      } else {
        boot();
      }
    })();
  </script>
</body>
</html>
