# SSE: disable proxy/gzip buffering so battle HP frames flush immediately.
# Include this INSIDE the existing `server { listen 443 ssl http2; ... }` block:
#   include /opt/waifu-bot-REBORN/infra/nginx/waifu-bot-api-sse.conf;
#
# `^~` beats regex `location /api/`. `proxy_pass` has NO URI (no trailing slash)
# so `/api/sse/stream` is forwarded intact to uvicorn on :8001.

location ^~ /api/sse/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Accel-Buffering no;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
